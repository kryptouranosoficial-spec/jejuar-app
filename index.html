<!doctype html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Jejuar - Gerenciamento de Jejum Intermitente</title>
    <meta name="description" content="Aplicativo inteligente de gerenciamento de jejum intermitente e sincronização metabólica." />
    <meta property="og:title" content="Jejuar - Gerenciamento de Jejum Intermitente" />
    <meta property="og:description" content="Aplicativo inteligente de gerenciamento de jejum intermitente e sincronização metabólica." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Configurações PWA (Progressive Web App) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#00C975" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jejuar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased min-h-screen selection:bg-[#00C975]/20 selection:text-[#006d3d]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registro Seguro do Service Worker PWA com Atualização Ativa -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Força a verificação de atualizações no servidor a cada recarga
            reg.update();
          }).catch((erro) => {
            console.warn('Registro do Service Worker:', erro);
          });
        });
      }
    </script>
  </body>
</html>
