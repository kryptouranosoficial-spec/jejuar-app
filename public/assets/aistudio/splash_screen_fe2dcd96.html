<script>
  (function initSplashTransition() {
    const stageText = document.getElementById('loading-stage');
    const percentText = document.getElementById('loading-percent');
    const progressBar = document.getElementById('loading-bar-fill');

    if (!stageText || !percentText || !progressBar) return;

    const stages = [
      { p: 40, text: 'Calibrando janelas metabólicas...' },
      { p: 72, text: 'Ajustando metas de hidratação...' },
      { p: 92, text: 'Sincronizando protocolos metabólicos...' },
      { p: 100, text: 'Pronto para começar!' }
    ];

    let currentStep = 2;
    const interval = setInterval(() => {
      currentStep = (currentStep + 1) % stages.length;
      const stage = stages[currentStep];
      
      stageText.textContent = stage.text;
      percentText.textContent = stage.p + '%';
      progressBar.style.width = stage.p + '%';

      if (stage.p === 100) {
        progressBar.classList.add('shadow-[0_0_12px_rgba(0,201,117,0.6)]');
      }
    }, 1800);
  })();
</script></main>
